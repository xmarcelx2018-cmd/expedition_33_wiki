{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 register-card">

            <h1 class="mb-4">Login</h1>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Login
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
