{% extends "base.html" %}

{% block content %}

<div class="container delete-page">

    <div class="delete-card">

        <h1>Delete Wiki Entry</h1>

        <div class="delete-divider">
            <span>◇</span>
        </div>

        <p class="delete-message">
            Are you sure you want to delete
            <strong>{{ wiki_entry.title }}</strong>?
        </p>

        <p class="delete-warning">
            This action cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="delete-actions">

                <button type="submit" class="delete-confirm">
                    Delete Entry
                </button>

                <a href="{% url 'wiki_detail' wiki_entry.pk %}" class="back-button">
                    ← Back to Entry
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
