{% extends "base.html" %}

{% block content %}

<div class="container form-page">

    <div class="form-card">
        <h1>Add Wiki Entry</h1>

        <form method="post" class="wiki-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="form-submit">
                Add Entry
            </button>
        </form>
    </div>

</div>

{% endblock %}
